name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
    types: [checks_requested]
  # Nightly clean build of `main`: a check that nothing passes only because of the build cache.
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Ignore the build cache and build from scratch"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on `main` save the build cache that later runs start from, so a newer push waits for the
  # running one instead of cancelling it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The three jobs run in parallel and share two caches with different lifetimes. Each job restores
# the newest `main` entry for the same toolchain and manifest. Lake decides what to rebuild from
# content hashes, so a restored build is only a starting point: whatever the checkout changed, and
# everything importing it, is rebuilt. Lake regenerates `*.setup.json` files per build and never
# reads old ones, so they are not cached.
#
# Only the `build` job on `main` saves either cache, after it also builds what only `Lint` and
# `Test` use:
# - Dependencies (`.lake/packages`, including Mathlib's oleans, the cslib build and dependency C
#   objects) are saved when the list of their build outputs changes. The pins change that list, and
#   so does a PolyFun import that first reaches a dependency module.
# - PolyFun's own build (`.lake/build`) changes with every commit, so it is saved on every run.
#
# The job names `build`, `Lint (environment linters)` and `Test` are required status checks on
# `main`; keep them stable.

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLEAN_BUILD: ${{ github.event_name == 'schedule' || inputs.clean_build == true }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          # Saved keys end in a hash of the output list, so this key never matches and the restore
          # takes the newest entry for these pins.
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          # No fallback to other pins: the old pins' build outputs would stay in the cache through
          # every bump, and `lake exe cache get` replaces Mathlib's outputs either way.
          restore-keys: |
            lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Restore build cache
        if: env.CLEAN_BUILD != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: polyfun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            polyfun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            polyfun-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Lean environment
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: lake exe cache get

      - name: Run validation wrapper
        run: ./scripts/validate.sh --axioms

      # Every job starts from what `main` saves, so `main` also builds the targets that only `Lint`
      # and `Test` use. Pull requests leave them to those jobs. This build only fills the caches:
      # `Lint` and `Test` report its failures and warnings, and a failure here still saves what did
      # build.
      - name: Build what Lint and Test need
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: lake build PolyFunTest polyfun-parliament @batteries/runLinter

      - name: Name the dependency outputs
        id: deps-outputs
        if: success() && github.ref == 'refs/heads/main'
        env:
          KEY_PREFIX: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
        run: |
          outputs="$(find .lake/packages -path '*/.lake/build/*' -type f ! -name '*.setup.json' ! -name lock -printf '%P\n' | LC_ALL=C sort | sha256sum | cut -c1-16)"
          echo "key=$KEY_PREFIX-$outputs" >> "$GITHUB_OUTPUT"

      # Cache entries are immutable, so a changed output list needs a new key. For fixed pins the
      # list only grows, because each run starts from the newest entry, so a key never comes back.
      - name: Save dependency cache
        if: success() && github.ref == 'refs/heads/main' && steps.deps-outputs.outputs.key != steps.deps-cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          key: ${{ steps.deps-outputs.outputs.key }}

      # Keyed by run as well as commit, so a rerun on `main` still saves; restores take the newest
      # match for the same pins.
      - name: Save build cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: polyfun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}

  lint:
    name: Lint (environment linters)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLEAN_BUILD: ${{ github.event_name == 'schedule' || inputs.clean_build == true }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      # Paths and key prefixes must match the saves in `build` exactly, or the restore misses.
      - name: Restore dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Restore build cache
        if: env.CLEAN_BUILD != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: polyfun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            polyfun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            polyfun-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Lean environment
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: lake exe cache get

      - name: Build production and example libraries
        run: lake build PolyFun ToCslib ComplexityBackends PolyFunIO PolyFunExamples +PolyFunParliamentMain --wfail

      # One process per lint root. A single `lake lint` keeps every root's imports alive and reads
      # each later root's oleans into memory instead of mapping them, so it exhausts the runner
      # (docs/development/linting.md#commands-and-coverage).
      - name: Run environment linters
        run: |
          uv run --no-project --python 3.12 python -c "import tomllib; print('\\n'.join(tomllib.load(open('lakefile.toml', 'rb'))['lintDriverArgs']))" |
            while read -r root; do
              lake exe runLinter "$root"
            done

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLEAN_BUILD: ${{ github.event_name == 'schedule' || inputs.clean_build == true }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      # Paths and key prefixes must match the saves in `build` exactly, or the restore misses.
      - name: Restore dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Restore build cache
        if: env.CLEAN_BUILD != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: polyfun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            polyfun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            polyfun-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Lean environment
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: lake exe cache get

      - name: Run test library
        run: |
          lake build PolyFunTest --wfail --iofail
          lake test
          lake -d test/DocumentationConsumer build --wfail
          lake build polyfun-parliament --wfail
          uv run --no-project --python 3.12 python scripts/test-parliament-cli.py
          lake -d test/ParliamentConsumer build --wfail
