name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, lint, test, axioms
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # One build cache for the whole run: an exact hit on this commit, otherwise the newest
      # cache for the same toolchain and dependency pins (normally the latest `main` build).
      - name: Restore Lean build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: lake-cache
        with:
          path: ./.lake
          key: ${{ runner.os }}-lean-ci-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-ci-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            ${{ runner.os }}-lean-ci-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Lean environment
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: lake exe cache get

      - name: Run validation wrapper
        run: ./scripts/validate.sh --lint --test --axioms

      # Only `main` publishes caches: a cache saved there is visible to every branch, and the
      # per-commit key keeps the restore prefix pointing at the newest complete build.
      - name: Save Lean build cache
        if: success() && github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./.lake
          key: ${{ runner.os }}-lean-ci-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
