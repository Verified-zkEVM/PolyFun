name: Lint Style

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Style
    runs-on: ubuntu-latest

    steps:
      - uses: leanprover-community/lint-style-action@3e0c04138df9ad1e89721436ce3cbcff4d7818c5 # 2026-09-26
        with:
          mode: check
      # The action invokes lint-style with the default target (PolyFun).
      # The adapter, staging, and example libraries are separate, non-default targets.
      - name: Lint auxiliary libraries and examples
        run: lake exe lint-style ToCslib ComplexityBackends Examples.Tutorials.Requests Examples.Tutorials.Machines Examples.Tutorials.IndexedPrograms Examples.Parliament PolyFunParliamentMain
