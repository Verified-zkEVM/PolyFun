name: Lint Style

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Style
    runs-on: ubuntu-latest

    steps:
      - uses: leanprover-community/lint-style-action@a7e7428fa44f9635d6eb8e01919d16fd498d387a # 2025-08-18
        with:
          mode: check
      # The action invokes lint-style with the default target (PolyFun).
      # The adapter, staging, and example libraries are separate, non-default targets.
      - name: Lint auxiliary libraries and examples
        run: lake exe lint-style ToCslib ComplexityBackends Examples.Tutorials.Requests Examples.Tutorials.Machines Examples.Tutorials.IndexedPrograms Examples.Tutorials.InteractionTrees Examples.Parliament PolyFunParliamentMain
