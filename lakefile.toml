name = "PolyFun"
defaultTargets = ["PolyFun"]

# `lake lint` runs Batteries' environment linters over all production libraries.
# `lake test` builds the `PolyFunTest` library; any failing `example` /
# `#guard` / `#eval` fails elaboration. This mirrors Mathlib and cslib, which
# reuse `batteries/runLinter` rather than shipping a local runner.
lintDriver = "batteries/runLinter"
lintDriverArgs = ["PolyFun", "ToCslib", "PolyFunCslib"]
testDriver = "PolyFunTest"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longFile = 1500
# The standalone `lake exe lint-style` tool (run in CI via `linting.yml`) reads
# these options. Disable the Mathlib-infrastructure text linters that do not
# apply to a downstream library: `pythonStyle` shells out to a `./scripts`
# Python linter, `checkInitImports` enforces Mathlib's own import graph, and
# `allScriptsDocumented` enforces Mathlib's `scripts/README.md`.
weak.linter.pythonStyle = false
weak.linter.checkInitImports = false
weak.linter.allScriptsDocumented = false

[moreServerOptions]
linter.mathlibStandardSet = true
linter.style.longFile = 1500

# Pinned to Lean v4.33.1 (matches `lean-toolchain`).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.33.1"

[[lean_lib]]
name = "PolyFun"

# Low-level extensions of the pinned cslib machine API. This target does not
# import PolyFun and is intentionally separate from the generated `PolyFun`
# umbrella; PolyFun backend adapters may import it explicitly.
[[lean_lib]]
name = "ToCslib"

# Optional adapter from the cslib machine substrate to PolyFun realizability.
# Kept outside the `PolyFun/` root so `import PolyFun` remains backend-neutral.
[[lean_lib]]
name = "PolyFunCslib"

# Test / worked-example library. Built by `lake test`, kept out of the
# `lake lint` scope. Glob-based, so no umbrella
# file is generated; the file-header style linter is relaxed on test files.
[[lean_lib]]
name = "PolyFunTest"
globs = ["PolyFunTest.+"]
leanOptions = { weak.linter.style.header = false }

# Kernel-level axiom / sorry accounting; see scripts/PolyFunAxiomSweep.lean.
# Runtime-imports the built PolyFun oleans, so run it after `lake build`.
[[lean_exe]]
name = "polyfun-axiomsweep"
srcDir = "scripts"
root = "PolyFunAxiomSweep"
supportInterpreter = true

# Isolated executable fixtures for the axiom-sweep mutation matrix. This library is not
# a default target and deliberately contains synthetic kernel taint.
#
# Package-prefixed on purpose. Lake gives every package's targets a flat namespace in the
# build graph, so a generically named library, executable, or module root here collides with
# the identically named one in any downstream package that ships its own axiom sweep — and
# both VCVio and ArkLib do. A collision makes `--root <Fixtures>.Tainted` ambiguous, which
# either fails a downstream fixture matrix or, worse, sweeps the wrong package's fixtures.
# Keep the `PolyFun` prefix on anything a dependent project is likely to name the same way.
[[lean_lib]]
name = "PolyFunAxiomSweepTestFixtures"
srcDir = "scripts"
globs = ["PolyFunAxiomSweepTestFixtures.+"]
